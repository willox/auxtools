[package]
name = "auxtools-cli"
description = "Starts BYOND worlds with auxtools' debugger in them, and reaches the worlds that run it"
version.workspace = true
publish = false
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license = "GPL-3.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
bincode = "1"
dmasm = { workspace = true }
dreammaker = { workspace = true }
interprocess = "=2.4.7"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["errhandlingapi", "handleapi", "jobapi2", "libloaderapi", "memoryapi", "minwindef", "ntdef", "processthreadsapi", "synchapi", "tlhelp32", "winbase", "winerror", "winnt", "winreg"] }

[lints]
workspace = true
