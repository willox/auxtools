[package]
name = "debug_server"
version.workspace = true
publish = false
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
auxtools = { path = "../auxtools" }
instruction_hooking = { path = "../instruction_hooking" }
lazy_static = { workspace = true }
serde = { version = "1", features = ["derive"] }
bincode = "1"
clap = "4"
dmasm = { workspace = true }
dreammaker = { workspace = true }
region = "3"
retour = { workspace = true }
interprocess = "=2.4.7"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["libloaderapi", "errhandlingapi", "ioapiset", "processthreadsapi"] }

[lints]
workspace = true
