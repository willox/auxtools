[package]
name = "hot_reload_test"
version = "0.1.0"
publish = false
authors.workspace = true
edition.workspace = true

# Same trick as test_runner: depending on the cdylib gets debug_server
# compiled before `cargo run` runs us.
[dependencies]
debug_server = { path = "../../debug_server" }
auxtools-cli = { path = "../../auxtools-cli" }
serde = { version = "1", features = ["derive"] }
bincode = "1"
dmasm = { workspace = true }

[lints]
workspace = true
